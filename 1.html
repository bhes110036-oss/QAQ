<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 響應式流體藝術</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    /* 移除邊距並隱藏捲軸，讓畫布完美全螢幕 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block; /* 避免底部出現微小間隙 */
    }
  </style>
</head>
<body>

<script>
let particles = [];

function setup() {
  // 創建與視窗一樣大的畫布
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  background(0);
}

function draw() {
  // 漸淡背景產生的殘影效果
  background(0, 0, 0, 10);

  // 滑鼠移動時產生粒子
  // p5.js 會自動將觸控對應到 mouseX/mouseY
  if (mouseX > 0 || mouseY > 0) {
    if (mouseIsPressed || (mouseX !== pmouseX || mouseY !== pmouseY)) {
      for (let i = 0; i < 2; i++) {
        particles.push(new Particle(mouseX, mouseY));
      }
    }
  }

  // 更新與繪製粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].show();
    if (particles[i].isFinished()) {
      particles.splice(i, 1);
    }
  }
}

// 響應式核心：當視窗縮放時自動調整畫布尺寸
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(0); 
}

// 粒子類別
class Particle {
  constructor(x, y) {
    this.pos = createVector(x, y);
    // 給予隨機的初始速度
    this.vel = p5.Vector.random2D().mult(random(1, 4));
    this.acc = createVector(0, 0);
    this.maxSpeed = 5;
    this.lifespan = 255;
    this.hue = (frameCount * 0.5) % 360; // 色相隨時間變化
    this.size = random(2, 8);
  }

  update() {
    // 简单的物理運動
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
    
    // 生命值下降
    this.lifespan -= 3;
    this.size *= 0.98;
  }

  show() {
    noStroke();
    // 使用發光感色彩
    fill(this.hue, 80, 100, this.lifespan / 2.5);
    
    // 畫出粒子
    ellipse(this.pos.x, this.pos.y, this.size);
    
    // 增加一點點連結線，增加藝術感
    if (particles.length > 1 && random() > 0.9) {
      stroke(this.hue, 50, 100, 10);
      line(this.pos.x, this.pos.y, mouseX, mouseY);
    }
  }

  isFinished() {
    return this.lifespan < 0;
  }
}

// 防止行動裝置上的預設滾動行為
function touchMoved() {
  return false;
}
</script>

</body>
</html>
